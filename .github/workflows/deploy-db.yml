# Applies migrations and deploys Edge Functions to the production Supabase
# project on merge to main (TECHNICAL_REQUIREMENTS.md §12).
#
# Repository secrets: SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD,
# SUPABASE_PROJECT_REF. Without them the job is skipped.
name: Deploy database

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/functions/**"
      - "supabase/config.toml"
  workflow_dispatch:

concurrency:
  group: deploy-db
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        id: secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "Supabase secrets are not set; skipping deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: supabase/setup-cli@v1
        if: steps.secrets.outputs.ready == 'true'
        with:
          version: 2.120.0

      - name: Link project
        if: steps.secrets.outputs.ready == 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Apply migrations
        if: steps.secrets.outputs.ready == 'true'
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"

      - name: Deploy get-shared-board
        if: steps.secrets.outputs.ready == 'true'
        run: supabase functions deploy get-shared-board --no-verify-jwt --project-ref "$SUPABASE_PROJECT_REF"
